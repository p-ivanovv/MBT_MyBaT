name: flutter_tab_app
description: A Flutter app with bottom navigation tabs - one with a textbox, one empty.

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.2
  flutter_bluetooth_serial: ^0.4.0
  permission_handler: ^11.3.1
  flutter_spinkit: ^5.2.0
  path_provider: ^2.1.1
  http: ^1.2.0
  app_links: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

# Workaround: Override path_provider_foundation to exclude it on Android builds
dependency_overrides:
  path_provider_foundation: 2.4.0

flutter:
  uses-material-design: true
